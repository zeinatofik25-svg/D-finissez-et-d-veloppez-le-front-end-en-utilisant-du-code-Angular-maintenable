<h2>Olympic games app</h2>
<hr/>
<div *ngIf="error" class="error">{{ error }}</div>
<div *ngIf="stats">
  <app-header [title]="titlePage" [indicators]="indicators"></app-header>
  <app-pie-chart
    elementId="DashboardPieChart"
    [labels]="stats.countryLabels"
    [data]="stats.medalsByCountry"
    [enableNavigation]="true"
  ></app-pie-chart>
</div>
